<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root{
  /* One committed world: a peacock-teal party table, cream paper tickets, marigold number balls,
     rani-pink daubers. Phone-first single column; the host screen widens to two columns on tablets. */
  --bg:#0c3537;
  --panel:#134446;
  --panel-2:#1b5658;
  --paper:#fff4dc;
  --ink:#221b16;
  --marigold:#f6a623;
  --rani:#e2387f;
  --mint:#62d6b2;
  --text:#f4efe4;
  --muted:#a8cdc7;
  --line:rgba(255,255,255,.13);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-lg:26px;
  --r-md:18px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0}
body{
  min-height:100vh;min-height:100dvh;
  background:
    radial-gradient(110% 55% at 0% 0%,rgba(246,166,35,.16),transparent 60%),
    radial-gradient(90% 45% at 100% 0%,rgba(226,56,127,.15),transparent 60%),
    var(--bg);
  background-color:var(--bg);
  color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;
  -webkit-tap-highlight-color:transparent;
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--marigold)}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.08}
h2{font-size:21px;font-weight:800}
p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.small{font-size:14px}
.center{text-align:center}
[hidden]{display:none!important}

/* festive bunting along the top edge */
.bunting{
  height:13px;margin-top:env(safe-area-inset-top);
  background:
    conic-gradient(from -45deg at 25% 100%,var(--marigold) 0 90deg,transparent 0),
    conic-gradient(from -45deg at 75% 100%,var(--rani) 0 90deg,transparent 0);
  background-size:52px 13px;background-repeat:repeat-x;
}

.wrap{max-width:560px;margin:0 auto;padding:0 16px 56px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 2px;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.01em;white-space:nowrap}
.brand b{color:var(--marigold)}
.brand.xl{font-size:clamp(48px,15vw,76px);line-height:.95}
.top-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.h1{font-size:clamp(30px,8.5vw,42px);font-weight:800}
.lede{color:var(--muted);font-size:17px;max-width:60ch}

.chip{
  display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:7px 12px;
  background:rgba(0,0,0,.22);border:1px solid var(--line);font-size:13px;font-weight:600;white-space:nowrap
}
button.chip{cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--mint);box-shadow:0 0 0 3px rgba(98,214,178,.22)}
.dot.warn{background:var(--marigold);animation:blink 1.2s infinite}
.dot.bad{background:var(--rani)}
@keyframes blink{50%{opacity:.35}}

.panel{background:var(--panel);border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:12px}
.panel.quiet{background:rgba(255,255,255,.04)}
details.panel>summary{cursor:pointer;font-family:var(--display);font-weight:800;font-size:19px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.panel>summary::-webkit-details-marker{display:none}
details.panel>summary::after{content:"+";font-size:24px;color:var(--marigold);line-height:1}
details.panel[open]>summary::after{content:"\2212"}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center;text-decoration:none;
  border:0;border-radius:999px;padding:13px 20px;font-weight:700;cursor:pointer;
  background:var(--marigold);color:var(--ink);min-height:48px;
  transition:transform .12s ease,filter .12s ease;
}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{font-size:18px;min-height:58px;width:100%}
.btn.pink{background:var(--rani);color:#fff}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn.small{min-height:40px;padding:9px 15px;font-size:15px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row>.btn{flex:1 1 140px}
.link-btn{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px;font-size:15px;align-self:center}
.link-btn.danger{color:#ff9cc2}

.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:15px;border:0;padding:0;margin:0;min-width:0}
.field>small{font-weight:400;color:var(--muted)}
.field legend{padding:0;margin-bottom:8px}
input[type=text],input:not([type]),input[type=number],textarea,select{
  width:100%;background:rgba(0,0,0,.25);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;
  font-size:17px;font-weight:500;
}
input:focus,textarea:focus,select:focus{border-color:var(--marigold);outline:none}
.code-input{text-transform:uppercase;letter-spacing:.3em;font-family:var(--display);font-weight:800;font-size:24px!important}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:#ffb3cf;font-size:15px;font-weight:600;min-height:0}
.err:empty{display:none}

.toggles{display:flex;flex-wrap:wrap;gap:8px}
.toggle{position:relative}
.toggle input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.toggle span{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:9px 14px;border:1.5px solid var(--line);font-weight:600;font-size:15px}
.toggle input:checked+span{background:var(--marigold);color:var(--ink);border-color:var(--marigold)}
.toggle input:disabled+span{opacity:.75}
.toggle input:focus-visible+span{outline:3px solid var(--marigold);outline-offset:2px}

/* number balls */
.ball{
  --size:172px;width:var(--size);height:var(--size);border-radius:50%;flex:none;
  background:radial-gradient(circle at 32% 26%,#ffd88a 0 7%,var(--marigold) 38%,#c97a07 100%);
  display:grid;place-items:center;
  box-shadow:inset -10px -14px 26px rgba(0,0,0,.24),0 18px 40px rgba(0,0,0,.35);
}
.ball span{
  width:64%;height:64%;border-radius:50%;background:var(--paper);color:var(--ink);display:grid;place-items:center;
  font-family:var(--display);font-weight:800;font-size:calc(var(--size)*.32);font-variant-numeric:tabular-nums;line-height:1
}
.ball.sm{--size:76px}
.ball.pop{animation:pop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6) rotate(-25deg)}100%{transform:none}}
.recent{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:34px}
.rb{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(246,166,35,.18);color:var(--marigold);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}

.stage{align-items:center;text-align:center;gap:14px;padding-top:22px}
.stage-meta{width:100%;display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.stage-meta b{color:var(--text);letter-spacing:.12em}
.call{min-height:52px;display:flex;flex-direction:column;align-items:center;gap:2px}
.call .phrase{font-family:var(--display);font-weight:800;font-size:22px;color:var(--marigold)}
.call .digits{color:var(--muted);font-size:16px}
.btn-next{
  position:relative;overflow:hidden;width:100%;min-height:68px;border:0;border-radius:999px;cursor:pointer;
  background:var(--rani);color:#fff;font-family:var(--display);font-weight:800;font-size:22px;
}
.btn-next:active{transform:scale(.98)}
.btn-next:disabled{opacity:.45}
.btn-next .bar{position:absolute;left:0;bottom:0;height:6px;width:0;background:rgba(255,255,255,.75)}
.btn-next .bar.run{animation:fill var(--dur,8000ms) linear forwards}
@keyframes fill{to{width:100%}}
.auto-row{display:flex;gap:10px;width:100%}
.auto-row>*{flex:1}
.toggle-btn{border-radius:999px;border:1.5px solid var(--line);background:transparent;padding:11px 14px;font-weight:700;cursor:pointer;min-height:46px}
.toggle-btn[aria-pressed="true"]{background:var(--mint);color:var(--ink);border-color:var(--mint)}
.auto-row select{border-radius:999px;min-height:46px;padding:10px 14px;font-size:15px}

/* 1 to 90 board */
.board{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.board i{
  aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:clamp(11px,3.2vw,14px);
  color:rgba(244,239,228,.42);background:rgba(255,255,255,.05);font-variant-numeric:tabular-nums
}
.board i.on{background:var(--marigold);color:var(--ink);font-weight:700}
.board i.last{box-shadow:0 0 0 3px var(--rani)}

/* the paper ticket */
.ticket{
  background:var(--paper);color:var(--ink);border-radius:var(--r-md);padding:10px 8px 12px;
  box-shadow:0 16px 36px rgba(0,0,0,.36);position:relative
}
.ticket::before,.ticket::after{
  content:"";position:absolute;top:31px;width:16px;height:16px;border-radius:50%;background:var(--bg)
}
.ticket::before{left:-8px}.ticket::after{right:-8px}
.ticket-head{
  display:flex;justify-content:space-between;gap:8px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;
  color:#8b6a3a;padding:0 6px 9px;border-bottom:2px dashed rgba(34,27,22,.2);margin-bottom:9px
}
.ticket-head span:last-child{text-align:right}
.tgrid{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.cell{
  aspect-ratio:1/1.14;border-radius:8px;display:grid;place-items:center;
  font-family:var(--display);font-weight:800;font-size:clamp(15px,4.8vw,25px);font-variant-numeric:tabular-nums;line-height:1
}
.cell.empty{background:repeating-linear-gradient(135deg,rgba(34,27,22,.08) 0 3px,transparent 3px 7px);border-radius:6px}
button.cell{border:1.5px solid rgba(34,27,22,.15);background:#fffaf0;color:var(--ink);cursor:pointer;padding:0;touch-action:manipulation}
.cell.dab{
  color:#fff;border-color:transparent;
  background:radial-gradient(circle closest-side,var(--rani) 0 84%,rgba(226,56,127,.35) 88%,transparent 92%),#fffaf0;
}
.cell.hl{box-shadow:0 0 0 3px var(--marigold) inset}
.cell.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.ticket.mini{padding:7px 6px 8px;box-shadow:none}
.ticket.mini::before,.ticket.mini::after{display:none}
.ticket.mini .ticket-head{font-size:10px;padding-bottom:6px;margin-bottom:6px}
.ticket.mini .cell{font-size:clamp(11px,3.4vw,16px);border-radius:5px}

/* prizes */
.prizes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.prizes li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 14px;border-radius:16px;background:rgba(0,0,0,.18)}
.prizes li div{display:flex;flex-direction:column;min-width:0}
.prizes li small{color:var(--muted);font-size:13px}
.prizes .status{font-weight:700;font-size:14px;text-align:right;color:var(--muted);flex:none;max-width:52%}
.prizes li.won{background:rgba(246,166,35,.14)}
.prizes li.won .status{color:var(--marigold)}
.prizes li.mine{background:var(--rani)}
.prizes li.mine .status,.prizes li.mine small{color:#fff}
.prizes li.close .status{color:var(--mint)}

/* players */
.roster{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.roster li{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 10px;border-radius:14px;background:rgba(0,0,0,.2);min-width:0}
.roster .tno{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.roster .pname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.roster .rm{background:none;border:0;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:6px 8px;border-radius:8px;flex:none;min-width:30px}
.roster .rm.armed{background:var(--rani);color:#fff;font-size:13px;font-weight:700}
.roster .empty-li{grid-column:1/-1;background:none;color:var(--muted);padding:6px 0}
.count-pill{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 8px;border-radius:999px;background:var(--marigold);color:var(--ink);font-size:15px;vertical-align:middle;margin-left:6px}

/* join card on host */
.join-card{align-items:center;text-align:center}
.qr{background:#fff;border-radius:20px;padding:10px;width:min(260px,70vw);aspect-ratio:1;display:grid;place-items:center}
.qr svg{width:100%;height:100%;display:block}
.qr.missing{background:rgba(255,255,255,.06);color:var(--muted);font-size:14px;padding:18px}
.code{font-family:var(--display);font-weight:800;font-size:44px;letter-spacing:.18em;color:var(--marigold);line-height:1}
.join-url{font-size:15px;color:var(--muted);word-break:break-all}

/* guest */
.strip{background:var(--panel);border-radius:var(--r-lg);padding:14px 16px;display:flex;align-items:center;gap:14px}
.strip .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.strip .call{min-height:0;align-items:flex-start;text-align:left}
.strip .call .phrase{font-size:19px}
.strip .call .digits{font-size:14px}
.strip .recent{justify-content:flex-start;min-height:0}
.strip .rb{width:28px;height:28px;font-size:12px}
.strip-msg{display:flex;flex-direction:column;gap:4px}
.strip-msg strong{font-family:var(--display);font-size:20px}
.t-tools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.hero{padding:26px 0 6px;display:flex;flex-direction:column;gap:12px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:flex-start;color:var(--muted)}
.steps li::before{counter-increment:s;content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:rgba(246,166,35,.18);color:var(--marigold);display:grid;place-items:center;font-weight:800;font-size:14px}
.steps b{color:var(--text)}

/* overlays */
.overlay{
  position:fixed;inset:0;z-index:50;background:rgba(5,22,23,.84);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto
}
.win-card,.sheet{
  position:relative;z-index:2;background:var(--panel-2);border-radius:28px;padding:24px 18px;width:100%;max-width:520px;
  display:flex;flex-direction:column;gap:12px;text-align:center;margin:auto;box-shadow:0 30px 80px rgba(0,0,0,.5)
}
.win-prize{font-size:clamp(36px,11vw,60px);color:var(--marigold);font-weight:800}
.win-names{font-family:var(--display);font-weight:800;font-size:clamp(30px,9vw,48px);line-height:1.05;overflow-wrap:anywhere}
.win-card.mine{background:var(--rani)}
.win-card.mine .win-prize{color:#fff}
.win-card.mine .eyebrow{color:rgba(255,255,255,.8)}
.win-tickets{display:flex;flex-direction:column;gap:10px;text-align:left}
.win-tickets .who{font-weight:700;font-size:14px;margin-bottom:4px}
canvas.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.copy-area{width:100%;min-height:200px;font-size:14px}
.sheet .qr{margin:0 auto}
.sheet-name{font-size:30px}

.toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;
  background:var(--paper);color:var(--ink);padding:12px 18px;border-radius:999px;font-weight:700;z-index:60;
  transition:all .25s ease;pointer-events:none;max-width:calc(100% - 32px);text-align:center
}
.toast.show{opacity:1;transform:translate(-50%,0)}

.results{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.results li{display:flex;flex-direction:column;padding:12px 16px;border-radius:16px;background:rgba(0,0,0,.2)}
.results .pz{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.results strong{font-family:var(--display);font-size:22px;color:var(--marigold)}
.results li.none strong{color:var(--muted)}

@media (min-width:900px){
  .wrap.wide{max-width:1120px;display:grid;grid-template-columns:minmax(360px,440px) 1fr;align-items:start}
  .wrap.wide>.top{grid-column:1/-1}
  .col{display:flex;flex-direction:column;gap:16px;min-width:0}
  .ball.big{--size:220px}
}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.wrap.wide>.err{grid-column:1/-1}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}
  .btn-next .bar.run{animation:none;width:0}
}
</style>
</head>

<script>
(function(){
'use strict';

/* ================= constants ================= */
const APP_PREFIX = 'jaldi5-';
const MAX_PLAYERS = 60;
const HOST_KEY = 'j5-host-v2';
const GUEST_KEY = 'j5-guest-v2';
const SPEEDS = [5, 8, 12, 20];

/*CORE-START*/
const PRIZES = [
  { key: 'early5',  name: 'Early Five',   desc: 'Any 5 numbers on your ticket' },
  { key: 'top',     name: 'Top Line',     desc: 'Every number in the top row' },
  { key: 'middle',  name: 'Middle Line',  desc: 'Every number in the middle row' },
  { key: 'bottom',  name: 'Bottom Line',  desc: 'Every number in the bottom row' },
  { key: 'corners', name: 'Four Corners', desc: 'First and last of the top and bottom rows' },
  { key: 'full',    name: 'Full House',   desc: 'All 15 numbers' }
];
const PRIZE = Object.fromEntries(PRIZES.map(p => [p.key, p]));

function hashSeed(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) {
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  h = Math.imul(h ^ (h >>> 16), 2246822507);
  h = Math.imul(h ^ (h >>> 13), 3266489909);
  return (h ^= h >>> 16) >>> 0;
}
function mulberry32(a) {
  return function () {

  try { peer = new P(APP_PREFIX + H.code, { debug: 0 }); } catch (e) { hostNet = 'error'; renderHostNet(); return; }
  hostPeer = peer;
  peer.on('open', () => { hostNet = 'ready'; hostIdRetries = 0; renderHostNet(); });
  peer.on('connection', conn => hostAccept(conn));
  peer.on('disconnected', () => {
    if (peer.destroyed || hostPeer !== peer) return;
    hostNet = 'reconnecting'; renderHostNet();
    setTimeout(() => { try { if (!peer.destroyed && peer.disconnected) peer.reconnect(); } catch (e) {} }, 1500);
  });
  peer.on('error', err => {
    const type = err && err.type;
    if (hostPeer !== peer) return;
    if (type === 'unavailable-id') {
      try { peer.destroy(); } catch (e) {}
      hostPeer = null;
      if (H.fresh && !H.roster.length) { H.code = genCode(); hostSave(); renderHost(); hostStartPeer(); return; }
      hostNet = 'reopening'; renderHostNet();
      if (++hostIdRetries <= 30) setTimeout(() => { if (H && VIEW === 'host') hostStartPeer(); }, 3000);
      else { hostNet = 'error'; renderHostNet(); }
      return;
    }
    if (type === 'peer-unavailable') return;
    if (type === 'browser-incompatible') { hostNet = 'incompatible'; renderHostNet(); return; }
    hostNet = 'reconnecting'; renderHostNet();
    setTimeout(() => {
      if (hostPeer !== peer || !H || VIEW !== 'host') return;
      if (peer.destroyed) { hostPeer = null; hostStartPeer(); }
      else { try { if (peer.disconnected) peer.reconnect(); } catch (e) {} }
    }, 3000);
  });
}
function hostStopPeer() {
  hostConns.forEach(c => { try { c.close(); } catch (e) {} });
  hostConns.clear();
  if (hostPeer) { try { hostPeer.destroy(); } catch (e) {} }
  hostPeer = null; hostNet = 'idle';
}
function hostAccept(conn) {
  let pid = null;
  conn.on('data', msg => {
    if (!H || !msg || typeof msg !== 'object') return;
    if (msg.t !== 'hello') return;
    const p = typeof msg.pid === 'string' && /^[a-z0-9]{8,24}$/.test(msg.pid) ? msg.pid : null;
    const name = cleanName(msg.name);
    if (!p) { sendTo(conn, { t: 'bad', msg: 'Something went wrong. Reload the page and try again.' }); return; }
    if ((H.removed || []).includes(p)) { sendTo(conn, { t: 'removed' }); return; }
    let r = H.roster.find(x => x.pid === p);
    if (!r) {
      if (!name) { sendTo(conn, { t: 'bad', msg: 'Type your name to join.' }); return; }
      if (H.roster.length >= MAX_PLAYERS) { sendTo(conn, { t: 'full' }); return; }
      if (H.status === 'over') { sendTo(conn, { t: 'bad', msg: 'This game has finished. Ask the host to start another round, then try again.' }); return; }
      r = { no: H.nextNo++, name, pid: p, from: H.status === 'live' ? H.called.length : 0 };
      H.roster.push(r);
      H.fresh = false;
      toast(name + ' joined');
    } else if (name && name !== r.name && H.status === 'lobby') {
      r.name = name;
    }
    pid = p;
    const old = hostConns.get(p);
    hostConns.set(p, conn);
    if (old && old !== conn) { try { old.close(); } catch (e) {} }
    sendTo(conn, { t: 'welcome', no: r.no, s: publicState() });
    hostSave(true);
    renderHostPlayers();
  });
  conn.on('close', () => { if (pid && hostConns.get(pid) === conn) { hostConns.delete(pid); renderHostPlayers(); } });
  conn.on('error', () => {});
}

function callNext() {

  if (!remaining.length) { H.status = 'over'; hostSave(); renderHost(); return; }
  const n = remaining[randInt(remaining.length)];
  H.called.push(n);
  const wins = detectWins(H, hostTicket);
  if (H.prizes.full.w.length || H.called.length >= 90) { H.status = 'over'; autoOn = false; }
  hostSave();
  if (soundOn) say(callSpeech(n));
  updateHostLive(true);
  if (wins.length) {
    if (soundOn) wins.forEach(w => say(PRIZE[w.key].name + ' goes to ' + joinNames(w.names) + '!', true));
    queueWins(wins.map(w => winView(publicState(), w, null, true)));
  } else if (H.status === 'over') renderHost();
  else scheduleAuto();
}

  return { key: w.key, nos: w.nos, names: w.names, num: w.num, at: w.at, code: state.code, round: state.round,
    called: state.called.slice(), froms, myNo, isHost, doneLabel };
}

/* ================= GUEST ================= */
let G = null;          // {code, pid, name, no, s, net, joined, auto, marks}
let gPeer = null, gConn = null, gTimer = null, gAttempts = 0, gConnecting = false;

function guestInit(code) {
  const saved = LS.get(GUEST_KEY);
  const pid = saved && typeof saved.pid === 'string' && /^[a-z0-9]{16}$/.test(saved.pid) ? saved.pid : genPid();
  G = { code, pid, name: saved && saved.name ? cleanName(saved.name) : '', no: null, s: null, net: 'idle', joined: false,
    auto: LS.get('j5-autodab') === true, marks: new Set(), seenWins: null, lastCount: null, markKey: '', err: '' };
  if (saved && saved.code === code && saved.joined && G.name) {
    G.joined = true;
    G.no = Number.isInteger(saved.no) ? saved.no : null;
  }
}
function guestPersist() { LS.set(GUEST_KEY, { code: G.code, pid: G.pid, name: G.name, joined: G.joined, no: G.no }); }
function guestConnect() {
  clearTimeout(gTimer);
  if (!G || ['removed', 'ended', 'full'].includes(G.net)) return;
  if (gConn && gConn.open) return;
  const P = getPeerCtor();
  if (!P) { G.net = 'nolib'; guestRender(); return; }
  if (!G.s) G.net = 'connecting';
  else G.net = 'reconnecting';
  guestRenderNet();
  const start = () => {
    if (gConn && gConn.open) return;
    if (gConnecting) return;
    gConnecting = true;
    let conn;
    try { conn = gPeer.connect(APP_PREFIX + G.code, { reliable: true }); } catch (e) { gConnecting = false; guestRetry(); return; }
    gConn = conn;
    const to = setTimeout(() => { if (!conn.open) { gConnecting = false; try { conn.close(); } catch (e) {} if (gConn === conn) gConn = null; guestRetry(); } }, 15000);
    conn.on('open', () => {
      clearTimeout(to); gConnecting = false; gAttempts = 0;
      conn.send({ t: 'hello', v: 2, pid: G.pid, name: G.name });
    });
    conn.on('data', guestOnData);
    conn.on('close', () => {
      clearTimeout(to); gConnecting = false;
      if (gConn !== conn) return;
      gConn = null;
      if (G && !['removed', 'ended', 'full', 'bad'].includes(G.net)) { G.net = 'lost'; guestRenderNet(); guestRetry(); }
    });
    conn.on('error', () => {});
  };
  if (gPeer && !gPeer.destroyed && gPeer.open) { start(); return; }
  if (gPeer) { try { gPeer.destroy(); } catch (e) {} }
  let peer;
  try { peer = new P({ debug: 0 }); } catch (e) { G.net = 'error'; guestRender(); return; }
  gPeer = peer;
  peer.on('open', () => { if (gPeer === peer) start(); });
  peer.on('disconnected', () => { setTimeout(() => { try { if (!peer.destroyed && peer.disconnected) peer.reconnect(); } catch (e) {} }, 1500); });
  peer.on('error', err => {
    if (gPeer !== peer || !G) return;
    gConnecting = false;
    const t = err && err.type;
    if (t === 'browser-incompatible') { G.net = 'incompatible'; guestRender(); return; }
    if (t === 'peer-unavailable') {
      if (gConn && !gConn.open) { try { gConn.close(); } catch (e) {} gConn = null; }
      G.net = G.s ? 'hostgone' : 'notfound';
    } else G.net = G.s ? 'lost' : 'error';
    guestRender();
    guestRetry();
  });
}
function guestRetry() {
  clearTimeout(gTimer);
  if (!G || ['removed', 'ended', 'full', 'bad'].includes(G.net)) return;
  if (!G.joined && G.net === 'notfound' && gAttempts >= 2) return; // stop hammering a wrong code before joining
  const delay = Math.min(12000, 2000 * Math.pow(1.4, gAttempts++));
  gTimer = setTimeout(() => {
    if (document.visibilityState === 'visible') guestConnect(); else guestRetry();
  }, delay);
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (VIEW === 'guest' && G && G.joined && !(gConn && gConn.open)) { gAttempts = 0; guestConnect(); }
  if (VIEW === 'host' && H && H.status === 'live') keepAwake();
  if (VIEW === 'host' && H && (!hostPeer || hostPeer.destroyed)) hostStartPeer();
});

function guestOnData(msg) {
  if (!G || !msg || typeof msg !== 'object') return;
  if (msg.t === 'welcome') {
    if (!Number.isInteger(msg.no)) return;
    G.no = msg.no; G.joined = true; G.net = 'ok'; G.err = '';
    guestPersist();
    keepAwake();
    guestSetState(msg.s);
    return;
  }
  if (msg.t === 'state') { guestSetState(msg.s); return; }
  if (msg.t === 'bad') {
    G.net = 'bad'; G.err = typeof msg.msg === 'string' ? msg.msg.slice(0, 160) : 'The host could not add you.';
    G.joined = false; guestPersist(); guestRender(); return;
  }
  if (msg.t === 'full') { G.net = 'full'; G.joined = false; guestPersist(); guestRender(); return; }
  if (msg.t === 'removed') { G.net = 'removed'; LS.del(GUEST_KEY); guestRender(); return; }
  if (msg.t === 'ended') { G.net = 'ended'; LS.del(GUEST_KEY); clearOverlays(); guestRender(); }
}
function guestMe() { return G && G.s ? G.s.roster.find(p => p.no === G.no) || null : null; }
function guestCalledForMe() { const me = guestMe(); return G.s ? G.s.called.slice(me ? me.from : 0) : []; }
function guestSetState(raw) {
  const s = cleanState(raw);
  if (!s || s.code !== G.code) return;
  const prev = G.s;
  G.s = s;
  G.net = 'ok';
  const key = 'j5m:' + s.code + ':' + s.round + ':' + G.no;
  if (key !== G.markKey) {
    G.markKey = key;
    G.marks = new Set((LS.get(key) || []).filter(n => Number.isInteger(n)));
    G.seenWins = null; G.lastCount = null;
  }
  // new winners since we last looked (never replay old ones after a reconnect)
  if (G.seenWins === null || !prev || prev.round !== s.round) G.seenWins = s.wins.length;
  else if (s.wins.length > G.seenWins) {
    const fresh = s.wins.slice(G.seenWins);
    G.seenWins = s.wins.length;
    queueWins(fresh.map(w => winView(s, w, G.no, false)));
  } else if (s.wins.length < G.seenWins) G.seenWins = s.wins.length;
  const isNew = G.lastCount !== null && s.called.length > G.lastCount;
  G.lastCount = s.called.length;
  if (isNew) buzz(25);
  guestRender(isNew);
}

function guestNetHTML() {
  const map = { ok: ['ok', 'Connected'], connecting: ['warn', 'Connecting…'], reconnecting: ['warn', 'Reconnecting…'],
    lost: ['warn', 'Reconnecting…'], hostgone: ['warn', 'Waiting for host…'], notfound: ['bad', 'Game not found'],
    error: ['bad', 'Connection problem'], nolib: ['bad', 'Couldn’t load'], idle: ['', 'Not connected'] };
  const [cls, txt] = map[G.net] || ['', ''];
  return '<span class="dot ' + cls + '"></span>' + esc(txt);
}
function guestRenderNet() { const el = $('#gNet'); if (el) el.innerHTML = guestNetHTML(); }

function guestRender(pop) {
  if (VIEW !== 'guest' || !G) return;
  if (['removed', 'ended', 'full', 'incompatible', 'nolib'].includes(G.net)) { guestEndScreen(); return; }
  if (!G.joined || !G.s) { guestJoinScreen(); return; }
  if (!$('#ticket')) guestTicketShell();
  guestUpdate(pop);
}
function guestEndScreen() {
  const msgs = {
    removed: ['You’ve been removed', 'The host took you off this game. If that was a mistake, ask them to let you back in.'],
    ended: ['The host closed the game', 'Thanks for playing! If there’s another game, scan the new code.'],
    full: ['This game is full', 'The host already has ' + MAX_PLAYERS + ' players. Ask them to start another game.'],
    incompatible: ['This browser can’t join', 'Open the link in Chrome or Safari instead.'],
    nolib: ['The game didn’t load', 'Check your internet connection and reload the page.']
  };
  const [h, p] = msgs[G.net];
  app.innerHTML = '<div class="bunting" aria-hidden="true"></div><main class="wrap"><header class="top"><div class="brand">Jaldi <b>Five</b></div></header>' +
    '<section class="panel"><h1 class="h1">' + esc(h) + '</h1><p class="lede">' + esc(p) + '</p>' +
    '<a class="btn" href="' + esc(baseUrl()) + '">Back to start</a></section></main>';
}
function guestJoinScreen() {
  const busy = !!G.name && ['connecting', 'reconnecting', 'lost', 'hostgone'].includes(G.net);
  const existing = $('#joinForm');
  if (existing && existing.dataset.code === G.code) {
    // update status only, keep what the guest is typing
    $('#gStatus').innerHTML = joinStatusHTML();
    $('#joinBtn').disabled = busy;
    $('#joinBtn').textContent = busy ? 'Joining…' : 'Join the game';
    return;
  }
  app.innerHTML = '<div class="bunting" aria-hidden="true"></div><main class="wrap"><header class="top"><div class="brand">Jaldi <b>Five</b></div><span class="chip" id="gNet">' + guestNetHTML() + '</span></header>' +
    '<section class="hero"><p class="eyebrow">Tambola · game ' + G.code.toUpperCase() + '</p><h1 class="h1">Grab your ticket</h1>' +
    '<p class="lede">Type your name and you’re in. The host’s phone calls the numbers and spots the winners.</p></section>' +
    '<form class="panel" id="joinForm" data-code="' + G.code + '" novalidate>' +
      '<label class="field"><span>Your name</span><input id="gName" maxlength="24" autocomplete="nickname" enterkeyhint="go" value="' + esc(G.name) + '" placeholder="e.g. Priya"></label>' +
      '<div id="gStatus">' + joinStatusHTML() + '</div>' +
      '<button class="btn big" type="submit" id="joinBtn">Join the game</button>' +
      '<p class="small muted">Wrong game? <a href="' + esc(baseUrl()) + '">Enter a different code</a></p>' +
    '</form></main>';
  const nameInput = $('#gName');
  if (!G.name) setTimeout(() => nameInput.focus(), 50);
  $('#joinForm').addEventListener('submit', e => {
    e.preventDefault();
    const name = cleanName(nameInput.value);
    if (!name) { G.err = 'Type your name so the host knows who won.'; G.net = 'bad'; $('#gStatus').innerHTML = joinStatusHTML(); nameInput.focus(); return; }
    G.name = name; G.err = ''; G.net = 'connecting'; gAttempts = 0;
    guestPersist();
    keepAwake();
    $('#joinBtn').disabled = true; $('#joinBtn').textContent = 'Joining…';
    $('#gStatus').innerHTML = joinStatusHTML();
    if (gConn && gConn.open) gConn.send({ t: 'hello', v: 2, pid: G.pid, name: G.name });
    else guestConnect();
  });
  guestJoinScreen();
}
function joinStatusHTML() {
  if (G.net === 'bad' && G.err) return '<p class="err" role="alert">' + esc(G.err) + '</p>';
  if (G.net === 'notfound') return '<p class="err" role="alert">Can’t find game ' + G.code.toUpperCase() + '. Check the code with the host and make sure their screen is open.</p>';
  if (G.net === 'error') return '<p class="err" role="alert">Couldn’t connect. Check your internet and try again.</p>';
  if (G.name && ['connecting', 'reconnecting', 'lost', 'hostgone'].includes(G.net)) return '<p class="small muted" role="status">Connecting to the host’s phone…</p>';
  return '';
}

function guestTicketShell() {
  app.innerHTML = '<div class="bunting" aria-hidden="true"></div><main class="wrap">' +
    '<header class="top"><div class="brand">Jaldi <b>Five</b></div><span class="chip" id="gNet"></span></header>' +
    '<section><p class="eyebrow" id="tMeta"></p><h1 class="h1" id="tName"></h1></section>' +
    '<section class="strip" id="strip" aria-live="polite"></section>' +
    '<div class="ticket" id="ticket"></div>' +
    '<div class="t-tools"><button class="toggle-btn" type="button" id="autoDab" aria-pressed="' + G.auto + '">Auto-dab</button><span class="small muted" id="dabHint">Tap a number when it’s called</span></div>' +
    '<section class="panel" id="tPrizes"></section>' +
    '<details class="panel" id="tBoardWrap"><summary>All called numbers</summary><div class="board" id="tBoard"></div></details>' +
    '<section class="panel quiet"><p class="small muted">Keep this page open during the game. If you close it, open the same link again and you’ll get your ticket back.</p>' +
      '<button class="link-btn" type="button" id="leaveBtn">Leave this game</button></section>' +
    '</main>';
  $('#ticket').addEventListener('click', e => {
    const b = e.target.closest('button[data-n]');
    if (!b || !G.s) return;
    const n = +b.dataset.n;
    if (G.s.status === 'lobby') { shake(b); toast('The game hasn’t started yet'); return; }
    const called = new Set(guestCalledForMe());
    if (G.auto && called.has(n)) { toast('Auto-dab marks called numbers for you'); return; }
    if (!called.has(n) && !G.marks.has(n)) { shake(b); toast(n + ' hasn’t been called yet'); return; }
    if (G.marks.has(n)) G.marks.delete(n); else G.marks.add(n);
    LS.set(G.markKey, [...G.marks]);
    guestUpdateTicket();
  });
  $('#autoDab').addEventListener('click', e => {
    G.auto = !G.auto; LS.set('j5-autodab', G.auto);
    e.currentTarget.setAttribute('aria-pressed', G.auto);
    guestUpdate(false);
  });
  $('#leaveBtn').addEventListener('click', e => armTwoTap(e.currentTarget, 'Tap again to leave', () => {
    LS.del(GUEST_KEY);
    try { if (gConn) gConn.close(); if (gPeer) gPeer.destroy(); } catch (err) {}
    gConn = null; gPeer = null; G = null;
    location.href = baseUrl();
  }));
}
function guestMarks() {
  const m = new Set(G.marks);
  if (G.auto) { const called = new Set(guestCalledForMe()); ticketNums(ticketOf(G.code, G.s.round, G.no)).forEach(n => { if (called.has(n)) m.add(n); }); }
  return m;
}
function guestUpdateTicket() {
  const grid = ticketOf(G.code, G.s.round, G.no);
  $('#ticket').innerHTML = ticketHTML(grid, { marks: guestMarks(), left: G.s.title, right: 'Ticket ' + G.no });
  $('#tPrizes').innerHTML = '<h2>Prizes</h2>' + prizeListHTML(G.s, G.no, new Set(guestCalledForMe()));
}
function guestUpdate(pop) {
  const s = G.s, me = guestMe();
  guestRenderNet();
  $('#tName').textContent = me ? me.name : G.name;
  $('#tMeta').textContent = 'Ticket ' + G.no + ' · ' + s.title + ' · code ' + s.code.toUpperCase() + (s.round > 1 ? ' · round ' + s.round : '');
  const strip = $('#strip');
  if (s.status === 'lobby') {
    strip.innerHTML = '<div class="strip-msg"><strong>You’re in!</strong><span class="muted">' + s.roster.length + ' player' + (s.roster.length === 1 ? '' : 's') + ' so far. The host will start soon, so keep this page open.</span></div>';
  } else if (s.status === 'over') {
    const fh = s.wins.find(w => w.key === 'full');
    strip.innerHTML = '<div class="strip-msg"><strong>Game over</strong><span class="muted">' + (fh ? 'Full House: ' + esc(joinNames(fh.names)) + '. ' : '') + 'Stay here in case the host starts another round.</span></div>';
  } else {
    const last = s.called[s.called.length - 1];
    const late = me && me.from > 0 ? '<span class="small muted">You joined after ' + me.from + ' numbers, so your ticket counts from then.</span>' : '';
    strip.innerHTML = '<div class="ball sm' + (pop ? ' pop' : '') + '"><span>' + (last || '?') + '</span></div>' +
      '<div class="grow"><p class="call">' + (last ? captionHTML(last) : '<span class="digits">First number coming up…</span>') + '</p>' +
      '<span class="small muted">' + s.called.length + ' of 90 called</span><div class="recent">' + recentHTML(s.called, 5) + '</div>' + late + '</div>';
  }
  $('#autoDab').hidden = s.status === 'lobby';
  $('#dabHint').textContent = s.status === 'lobby' ? 'This is your ticket. Numbers get dabbed as they’re called.' : (G.auto ? 'Called numbers are marked for you' : 'Tap a number when it’s called');
  guestUpdateTicket();
  $('#tBoard').innerHTML = boardHTML(s.called);
  $('#tBoardWrap').hidden = !s.called.length;
}

/* ================= HOME ================= */
function renderHome() {
  setView('home');
  const saved = loadHost();
  const resume = saved && saved.status !== 'over' ? saved : null;
  const savedGuest = LS.get(GUEST_KEY);
  const rejoin = savedGuest && savedGuest.joined && isCode(savedGuest.code) ? savedGuest : null;
  app.innerHTML = '<div class="bunting" aria-hidden="true"></div><main class="wrap">' +
    '<section class="hero"><h1 class="brand xl">Jaldi <b>Five</b></h1>' +
    '<p class="lede">Tambola for the whole party. One phone hosts and calls the numbers. Everyone else joins with a link and gets their own ticket.</p></section>' +
    (rejoin ? '<section class="panel"><h2>Back to your game?</h2><p class="small muted">You were playing as ' + esc(rejoin.name) + ' in game ' + rejoin.code.toUpperCase() + '.</p><a class="btn" href="?g=' + rejoin.code + '">Open my ticket</a></section>' : '') +
    '<form class="panel" id="codeForm" novalidate><h2>Join a game</h2>' +
      '<label class="field"><span>Game code from the host’s screen</span><input id="codeIn" class="code-input" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go" placeholder="ABCD"></label>' +
      '<p class="err" id="codeErr" role="alert"></p>' +
      '<button class="btn big" type="submit">Next</button></form>' +
    '<section class="panel"><h2>Host a game</h2>' +
      (resume ? '<p class="small muted">You have a game in progress: code ' + resume.code.toUpperCase() + ', ' + resume.roster.length + ' players, ' + resume.called.length + ' numbers called.</p><button class="btn big pink" type="button" id="resumeBtn">Resume hosting ' + resume.code.toUpperCase() + '</button>' : '') +
      '<ol class="steps"><li><span><b>Start a game</b> on the phone everyone can hear.</span></li><li><span><b>Guests scan the QR code</b> and type their name. No app or account needed.</span></li><li><span><b>Tap Start.</b> Numbers are called out loud and every winner pops up on screen with their name.</span></li></ol>' +
      '<button class="btn ' + (resume ? 'ghost' : 'pink big') + '" type="button" id="hostBtn">' + (resume ? 'Start a new game instead' : 'Host a game on this phone') + '</button></section>' +
    '</main>';
  $('#codeForm').addEventListener('submit', e => {
    e.preventDefault();
    const code = cleanCode($('#codeIn').value);
    if (!isCode(code)) { $('#codeErr').textContent = 'Game codes are 4 letters or numbers.'; return; }
    location.href = '?g=' + code;
  });
  if (resume) $('#resumeBtn').addEventListener('click', () => { H = resume; startHosting(true); });
  $('#hostBtn').addEventListener('click', e => {
    if (resume) armTwoTap(e.currentTarget, 'Tap again: this ends game ' + resume.code.toUpperCase(), () => startHosting(false));
    else startHosting(false);
  });
}

/* ================= boot ================= */
function boot() {
  const params = new URLSearchParams(location.search);
  const g = cleanCode(params.get('g'));
  if (isCode(g)) {
    setView('guest');
    guestInit(g);
    guestRender();
    if (G.joined) guestConnect();
    return;
  }
  renderHome();
}
boot();
})();
</script>
</body>
</html>
